[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelspend"
version = "0.8.0b3"
description = "Open-source router that selects the lowest-cost AI model expected to suit each task, using your own API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["llm", "router", "cost", "tokens", "openai", "anthropic", "gemini", "grok"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "jsonschema>=4.20",
  "typer>=0.12",
  "openai>=1.40",
  "anthropic>=0.40",
  "google-genai>=1.0",
]

[project.urls]
Homepage = "https://github.com/rmencke2/modelspend"
Issues = "https://github.com/rmencke2/modelspend/issues"
Changelog = "https://github.com/rmencke2/modelspend/blob/main/CHANGELOG.md"
Security = "https://github.com/rmencke2/modelspend/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
tokenizers = ["tiktoken>=0.7"]

[project.scripts]
modelspend = "modelspend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelspend = ["catalog/data/*.json", "eval/fixtures/*/*.jsonl", "server/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
